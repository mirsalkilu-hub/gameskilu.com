<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradien Neon Cyan ke Purple -->
    <linearGradient id="kiluGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#9B51E0" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ICON EMBLEM GAMESKILU -->
  <g transform="translate(10, 10)">
    <!-- Base Badge -->
    <rect x="0" y="0" width="100" height="100" rx="28" fill="#0F172A" stroke="#00F2FE" stroke-width="2.5" stroke-opacity="0.4" />
    
    <!-- Gamepad G Shape -->
    <path d="M 65 30 
             C 40 18, 22 35, 22 58 
             C 22 80, 42 94, 68 82 
             C 78 77, 78 65, 62 65 
             L 52 65" 
          fill="none" 
          stroke="url(#iconGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)" />
          
    <!-- D-Pad Left Accent -->
    <circle cx="38" cy="48" r="3.5" fill="#00F2FE" />
    <!-- Action Buttons Right Accent -->
    <circle cx="68" cy="42" r="3.5" fill="#9B51E0" />
    <circle cx="75" cy="50" r="3.5" fill="#00F2FE" />
  </g>

  <!-- TEKS LOGO -->
  <!-- "gameskilu" -->
  <text x="130" y="68" font-family="'Segoe UI', Roboto, 'Arial Black', sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="#FFFFFF">
    games<tspan fill="url(#iconGrad)" filter="url(#neonGlow)">kilu</tspan>
  </text>
  
  <!-- ".com" & Tagline -->
  <text x="358" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#00F2FE" opacity="0.9">
    .com
  </text>

  <text x="132" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#94A3B8" opacity="0.8">
    GAMING NEWS &amp; DOWNLOADS
  </text>
</svg>
